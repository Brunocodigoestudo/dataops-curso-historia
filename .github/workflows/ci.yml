# Workflow de CI: as instruções que o GitHub segue para conferir cada mudança.
name: CI do pipeline

# on: quando o workflow roda (o gatilho).
on:
  pull_request:                  # roda em todo pull request
  workflow_call:                 # permite que o cd.yml reaproveite este workflow

# jobs: os conjuntos de tarefas. Aqui existe um só, chamado qualidade.
jobs:
  qualidade:
    runs-on: ubuntu-latest       # a máquina: um Linux novo e vazio a cada execução
    env:
      DBT_PROFILES_DIR: .        # usa o profiles.yml da raiz do projeto
      DUCKDB_PATH: ci.duckdb     # banco próprio do CI, criado do zero a cada execução
    # steps: os passos, na ordem em que acontecem.
    steps:
      - uses: actions/checkout@v7        # baixa o código do repositório
      - uses: actions/setup-python@v7    # instala o Python
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar dependências      # instala dbt, pytest e as outras ferramentas
        run: pip install -r requirements.txt
      - name: Lint                       # confere o padrão do código Python
        run: ruff check .
      - name: Testes unitários e de integração   # pytest, com cobertura mínima de 80%
        run: pytest --cov=src --cov-fail-under=80
      - name: Carregar dados de exemplo  # a máquina começa vazia: carrega os CSVs
        run: python -m src.ingestao
      - name: Build e testes do dbt      # monta as tabelas e roda os testes do dbt
        run: dbt build --target ci
